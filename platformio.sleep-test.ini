; Isolated hardware probe. Does not build or replace normal firmware artifacts.
[platformio]
default_envs = Waveshare-AMOLED-206
src_dir = tests/hardware/light_sleep
build_dir = .pio/build-light-sleep
libdeps_dir = .pio/libdeps

[env:Waveshare-AMOLED-206]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:pre_patch_gfx_lib.py
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions_ota_32MB.csv
board_upload.flash_size = 32MB
board_build.flash_size = 32MB
upload_flags = 
	--no-stub
build_flags = 
	-I include
	-I src
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D WAVESHARE_S3_AMOLED_206=1          ; device selection
	-D WAVESHARE_AMOLED_206_DISPLAY=1     ; display selection
	-D PIN_BUTTON_1=0
	-D MONITOR_SPEED=115200
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-Werror=format
lib_deps = 
	bblanchon/ArduinoJson@6.21.6
	https://github.com/tzapu/WiFiManager.git#v2.0.17
	mathertel/oneButton@2.6.2
	arduino-libraries/NTPClient@3.2.1
	moononournation/GFX Library for Arduino@1.6.4
	lvgl/lvgl@9.3.0
	lewisxhe/XPowersLib@0.2.6
lib_ignore = 
	libhelix
	codec-helix
	TFT_eSPI
	rm67162
	HANSOLOminerv2
	LovyanGFX
	OpenFontRender

