; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

default_envs =  Waveshare-AMOLED-206

; Global configuration for all environments
[env]
monitor_eol = CRLF
monitor_echo = yes
monitor_filters = 
	esp32_exception_decoder
	time
	log2file
	send_on_enter



[env:Waveshare-AMOLED-206]
; Pinned: 6.x ships Arduino core 2.0.17. Core 3.x (platform 50.x+) breaks this
; codebase (SHA register access and GFX patch script) — do not float.
; 6.11.0 (not 6.12.0): 6.12.0 bumped esptool to 4.9.0, which fails with
; "No module named 'intelhex'" because PlatformIO doesn't install its deps.
platform = espressif32@6.11.0
platform_packages =
    framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
    pre:scripts/private_build_paths.py
    pre:scripts/build_celebration_audio.py
    pre:pre_patch_gfx_lib.py
    post:post_build_merge.py
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions_ota_32MB.csv
board_upload.flash_size = 32MB
board_build.flash_size = 32MB
; upload_port intentionally not set — PlatformIO auto-detects the serial port.
; (A hardcoded /dev/cu.* path breaks `pio run -t upload` on other machines.)
upload_flags =
    --no-stub
build_flags =
    -I include
    -I src
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D WAVESHARE_S3_AMOLED_206=1          ; device selection
    -D WAVESHARE_AMOLED_206_DISPLAY=1     ; display selection
    -D PIN_BUTTON_1=0
    -D MONITOR_SPEED=${this.monitor_speed}
    -D LV_CONF_INCLUDE_SIMPLE
    ; LVGLImage.py-generated image .c files (landing frames) include LVGL via
    ; this macro; without it they fall back to "lvgl/lvgl.h" which doesn't resolve.
    -D LV_LVGL_H_INCLUDE_SIMPLE
lib_deps = 
    bblanchon/ArduinoJson@6.21.6
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    mathertel/oneButton@2.6.2
    arduino-libraries/NTPClient@3.2.1
    moononournation/GFX Library for Arduino@1.6.4
    lvgl/lvgl@9.3.0
	lewisxhe/XPowersLib@0.2.6
    ; MP3 decoder: pinned CC0 minimp3 is vendored under src/third_party/minimp3.
lib_ignore = 
    ; Ignore an old cached decoder left by an earlier checkout.
    libhelix
    codec-helix
    TFT_eSPI
    rm67162
    HANSOLOminerv2
    LovyanGFX
    OpenFontRender
