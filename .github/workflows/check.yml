name: Firmware checks
on:
  pull_request:
  push:
    branches: [main, prerelease]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOLOMINER_PUBLIC_BUILD: "1"
jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public source archive
        run: python scripts/export_source.py --public --output "$RUNNER_TEMP/source-review"
      - name: Install pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan source and Git history
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="--all" --redact --no-banner
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact --no-banner
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - run: pio pkg install -e Waveshare-AMOLED-206
      - run: python tests/run_tests.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: pio run -e Waveshare-AMOLED-206
      # Approved artifacts are prepared by the separate draft-release workflow.
