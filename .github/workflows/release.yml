name: Prepare draft firmware release
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SOLOMINER_PUBLIC_BUILD: "1"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check recorded publication decisions
        run: python scripts/check_release_readiness.py
      - run: python -m pip install -r requirements-build.txt
      - run: pio pkg install -e Waveshare-AMOLED-206
      - run: python tests/run_tests.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: pio run -e Waveshare-AMOLED-206
      - name: Package matching dependency and application source
        run: |
          python scripts/export_dependencies.py --public --output dist
          python scripts/export_source.py --public --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/
            dist/*.zip
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: release-files
      - name: Read source version
        id: version
        run: python -c 'import os; from scripts.firmware_artifacts import version; print("version=" + version("."), file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SOLOMINER ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-files/firmware/**/*.bin
            release-files/firmware/**/*_manifest.json
            release-files/dist/*.zip
