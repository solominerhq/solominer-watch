name: Feature request
description: Suggest a focused improvement to the watch.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the situation and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain the simplest improvement and any battery or usability tradeoffs.
